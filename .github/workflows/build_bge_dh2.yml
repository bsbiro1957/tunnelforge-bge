name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Apply BGE DH2 fix safely via Python
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          import os

          target_file = "android/app/src/main/cpp/modp2048_data.c"
          if not os.path.exists(target_file):
              print(f"Hiba: A {target_file} nem található!")
              exit(1)

          print(f"Fájl szerkesztése: {target_file}")

          with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          if "rfc3526_modp2048_p" in content:
              print("A rfc3526_modp2048_p tömb megtalálva, frissítés folyamatban...")
              if "0x00, 0x00, 0x00, 0x00," in content:
                  content = content.replace("0x00, 0x00, 0x00, 0x00,", "0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45,")
              else:
                  content = content.replace(
                      "0x2b, 0x0a, 0x6d, 0xf2, 0x5f, 0x14, 0x37,", 
                      "0x2b, 0x0a, 0x6d, 0xf2, 0x5f, 0x14, 0x37, 0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45, 0xe4, 0x85, 0xb5, 0x76,"
                  )

          with open(target_file, "w", encoding="utf-8") as f:
              f.write(content)

          print("Siker: A modp2048_data.c sikeresen frissítve a BGE DH2 adatokkal!")
          '

          git add .
          git commit -m "Applied BGE DH2 fix to modp2048_data.c"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          
          # Hozzáadtuk aGradle verzióellenőrzés kihagyását bypassoló kapcsolót
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
