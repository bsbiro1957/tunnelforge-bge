name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Apply patch, init git and build
        run: |
          cp bge_dh2.patch tunnel-forge-src/
          cd tunnel-forge-src
          patch -p1 < bge_dh2.patch

          # Helyi Git repository inicializálása, hogy a Makefile/build ne hibázzon el 128-as kóddal
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "v0.7.4 with bge dh2 patch"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
