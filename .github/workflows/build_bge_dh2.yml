name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Clean patch and build
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          # Python alapú tisztítás a malformed sorok és sorvégek javítására
          python3 -c "
          with open('../bge_dh2.patch', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          
          # Sorvégek egységesítése és felesleges szóközök eltávolítása a sorok végéről
          cleaned_lines = [line.rstrip() + '\n' for line in content.splitlines()]
          
          with open('clean.patch', 'w', encoding='utf-8') as f:
              f.writelines(cleaned_lines)
          "

          patch -p1 --binary < clean.patch

          git add .
          git commit -m "Applied BGE DH2 patch"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
