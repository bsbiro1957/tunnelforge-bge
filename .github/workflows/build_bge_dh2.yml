name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Diagnostic and Smart Patch Application
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          import os

          print("=== PATCH FÁJL TARTALMA ===")
          if os.path.exists("../bge_dh2.patch"):
              with open("../bge_dh2.patch", "r", encoding="utf-8", errors="ignore") as f:
                  print(f.read())
          else:
              print("A ../bge_dh2.patch nem található!")

          # Megkeressük az összes .c fájlt, amiben szerepelhet a kulcs
          target_file = None
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".c"):
                      file_path = os.path.join(root, file)
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      if "0x00" in content and ("ikev" in file.lower() or "dh" in file.lower() or "crypto" in file.lower() or "ike" in content.lower()):
                          target_file = file_path
                          print(f"Potenciális célpont találva: {target_file}")
                          break
              if target_file:
                  break

          # Ha így sem lenne meg, keressük kifejezetten az ikev1.c-t
          if not target_file:
              for root, dirs, files in os.walk("."):
                  if "ikev1.c" in files:
                      target_file = os.path.join(root, "ikev1.c")
                      break

          if not target_file or not os.path.exists(target_file):
              print("Hiba: Nem található megfelelő C forrásfájl a módosításhoz!")
              exit(1)

          print(f"Kiválasztott fájl szerkesztésre: {target_file}")

          with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          new_lines = []
          replaced = False
          new_code = "    0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45,\n"

          for line in lines:
              # Rugalmasan keressük a nullás tömböket soron belül
              stripped_clean = line.replace(" ", "").replace("\t", "")
              if "0x00,0x00,0x00,0x00" in stripped_clean and not replaced:
                  # Megtartjuk az eredeti behúzást
                  indent = ""
                  for char in line:
                      if char in " \t":
                          indent += char
                      else:
                          break
                  new_lines.append(indent + new_code.strip() + "\n")
                  replaced = True
                  print(f"Sikeresen cserélve ezen a soron: {line.strip()}")
              else:
                  new_lines.append(line)

          if replaced:
              with open(target_file, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print("Siker: A fájl sikeresen frissítve!")
          else:
              print("Hiba: Nem találtunk cserélhető nullás tömböt a fájlban!")
              # Kiírjuk a fájl első 100 sorát debug céllal
              print("--- Fájl eleje ---")
              for i, l in enumerate(lines[:100]):
                  print(f"{i+1}: {l.rstrip()}")
              exit(1)
          '

          git add .
          git commit -m "Applied BGE DH2 fix"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
