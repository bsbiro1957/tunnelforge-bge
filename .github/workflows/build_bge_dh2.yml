name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository (patch)
        uses: actions/checkout@v4

      - name: Checkout TunnelForge source code (v0.7.4)
        uses: actions/checkout@v4
        with:
          repository: evokelektrique/tunnel-forge
          ref: v0.7.4
          path: tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Apply patch and build
        run: |
          cp bge_dh2.patch tunnel-forge-src/
          cd tunnel-forge-src
          git apply bge_dh2.patch
          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
