name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Initialize and apply direct fix
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          file_path = "android/app/src/main/cpp/ikev1.c"
          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          old_code = "    0x00, 0x00, 0x00, 0x00,"
          new_code = "    0x4f,0xe1,0x35,0x6d,0x6d,0x51,0xc2,0x45,"

          if old_code in content:
              content = content.replace(old_code, new_code)
              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Siker: Az ikev1.c frissítve.")
          else:
              print("Hiba: A keresett sor nem található az ikev1.c-ben!")
              exit(1)
          '

          git add .
          git commit -m "Applied BGE DH2 fix"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
