name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Apply BGE DH2 fix directly to modp2048_data.c
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          import os

          target_file = "android/app/src/main/cpp/modp2048_data.c"
          if not os.path.exists(target_file):
              print(f"Hiba: A {target_file} nem található!")
              exit(1)

          print(f"Fájl szerkesztése: {target_file}")

          with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          # Itt cseréljük ki a cél tömböt vagy szekvenciát a BGE DH2 adatokra
          # Megkeressük a rfc3526_modp2048_p definíciót és frissítjük a tartalmát
          if "rfc3526_modp2048_p" in content:
              # Cseréljük a generátor/csoport adatait a kívánt hex blokkra
              # A patch alapján beillesztjük a megfelelő bájtokat
              print("A rfc3526_modp2048_p tömb megtalálva, frissítés...")
              
              # Példa a cserére: a harmadik-negyedik sortól kezdődő adatok felülírása
              # Helyette egy biztosabb blokk-cserét hajtunk végre:
              # Megkeressük a tömb kezdetét és kicseréljük a belső hex értékeket
              
              # A bge_dh2.patch által megkövetelt pontos adatsorok beillesztése:
              # Ha a patch-ből akarjuk kiolvasni vagy fixen beírni:
          
          # Olvassuk ki a bge_dh2.patch-et, ha van benne modp2048_data.c tartalom
          patch_applied = False
          patch_path = "../bge_dh2.patch"
          if os.path.exists(patch_path):
              with open(patch_path, "r", encoding="utf-8", errors="ignore") as pf:
                  patch_data = pf.read()
              # Ha a patch tartalmazza a modp2048_data.c módosításait, rákényszeríthetjük pythonból
              # De egyszerűbb, ha közvetlenül a modp2048_data.c-ben lévő nullás / eredeti sorokat cseréljük:

          with open(target_file, "r", encoding="utf-8") as f:
              lines = f.readlines()

          new_lines = []
          replaced_count = 0
          for line in lines:
              # Ha találunk benne nullás blokkot vagy a cserélni kívánt mintát, felülírjuk a BGE DH2 értékkel
              # A BGE DH2 patch általában a 7-8. sor körüli értékeket írja át:
              if "0x2b, 0x0a, 0x6d, 0xf2" in line:
                  # Példaként beillesztjük a BGE DH2 sorokat
                  new_lines.append("    0x2b, 0x0a, 0x6d, 0xf2, 0x5f, 0x14, 0x37, 0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45, 0xe4, 0x85, 0xb5, 0x76,\n")
                  replaced_count += 1
              else:
                  new_lines.append(line)

          # Ha nem találtuk a fenti specifikus sort, próbáljuk meg a patch fájl alapján megkeresni a minuszos sorokat és átírni pluszosra
          if replaced_count == 0 and os.path.exists(patch_path):
              print("Alternatív patch elemzés indítása a modp2048_data.c-hez...")
              with open(patch_path, "r", encoding="utf-8") as pf:
                  plines = pf.readlines()
              
              # Keresés a patch fájlban a modp2048_data.c változtatásokra
              in_target_patch = False
              old_chunk = []
              new_chunk = []
              for pl in plines:
                  if "modp2048_data.c" in pl:
                      in_target_patch = True
                      continue
                  if in_target_patch:
                      if pl.startswith("---") or pl.startswith("+++") or pl.startswith("diff"):
                          continue
                      if pl.startswith("@@"):
                          continue
                      if pl.startswith("-"):
                          old_chunk.append(pl[1:].strip())
                      elif pl.startswith("+"):
                          new_chunk.append(pl[1:].strip())
                      elif pl.startswith(" "):
                          pass

              # Ha sikerült kinyerni a mintát a patchből
              if old_chunk:
                  old_str = " ".join(old_chunk).replace(",", "").replace(" ", "")
                  # Megpróbáljuk megkeresni a fájlban
                  full_text = "".join(lines)
                  clean_full = full_text.replace(",", "").replace(" ", "").replace("\n", "")
                  if old_str in clean_full:
                      print("Megvan a patch minta a szövegben! Közvetlen csere...")
                      # Egyszerűsített csere a patch alapján
                      # Mivel a modp2048_data.c-ben a BGE DH2 fix cseréli a kulcsot:
                      content = content.replace("0x00, 0x00, 0x00, 0x00,", "0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45,")
                      replaced_count = 1

          # Biztosíték: Ha eddig nem cserélődött, de a fájl létezik, írjuk be fixen a BGE DH2 kulcsot a megfelelő helyre
          if replaced_count == 0:
              print("Kényszerített BGE DH2 beillesztés a modp2048_data.c fájlba...")
              # Megkeressük a const uint8_t rfc3526_modp2048_p tömböt és módosítjuk a 8. sor környékét
              for i, line in enumerate(lines):
                  if "0x2b, 0x0a, 0x6d, 0xf2" in line:
                      lines[i] = "    0x2b, 0x0a, 0x6d, 0xf2, 0x5f, 0x14, 0x37, 0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45, 0xe4, 0x85, 0xb5, 0x76,\n"
                      replaced_count = 1

          if replaced_count > 0 or "0x4f, 0xe1, 0x35, 0x6d" in "".join(lines):
              with open(target_file, "w", encoding="utf-8") as f:
                  f.writelines(lines if 'lines' in locals() else new_lines)
              print("Siker: A modp2048_data.c sikeresen frissítve a BGE DH2 adatokkal!")
          else:
              print("Hiba: Nem sikerült beilleszteni a változtatást a modp2048_data.c-be.")
              exit(1)
          '

          git add .
          git commit -m "Applied BGE DH2 fix to modp2048_data.c"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
