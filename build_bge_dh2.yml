name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Apply BGE DH2 modifications directly and build
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          # Közvetlen Python alapú fájlmódosítás a patch fájl elkerülésére
          python3 -c '
          file_path = "android/app/src/main/cpp/ikev1.c"
          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          old_define = "#define IKE_DH_PUBKEY_BYTES 256"
          new_define = """#define IKE_DH_PUBKEY_BYTES 128
          static const uint8_t rfc2409_modp1024_p[128] = {
              0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,
              0xc9,0x0f,0xda,0xa2,0x21,0x68,0xc2,0x34,
              0xc4,0xc6,0x62,0x8b,0x80,0xdc,0x1c,0xd1,
              0x29,0x02,0x4e,0x08,0x8a,0x67,0xcc,0x74,
              0x02,0x0b,0xbe,0xa6,0x3b,0x13,0x9b,0x22,
              0x51,0x4a,0x08,0x79,0x8e,0x34,0x04,0xdd,
              0xef,0x95,0x19,0xb3,0xcd,0x3a,0x43,0x1b,
              0x30,0x2b,0x0a,0x6d,0xf2,0x5f,0x14,0x37,
              0x4f,0xe1,0x35,0x6d,0x6d,0x51,0xc2,0x45,
              0xe4,0x85,0xb5,0x76,0x62,0x5e,0x7e,0xc6,
              0xf4,0x4c,0x42,0xe9,0xa6,0x37,0xed,0x6b,
              0x0b,0xff,0x5c,0xb6,0xf4,0x06,0xb7,0xed,
              0xee,0x38,0x6b,0xfb,0x5a,0x89,0x9f,0xa5,
              0xae,0x9f,0x24,0x11,0x7c,0x4b,0x1f,0xe6,
              0x49,0x28,0x66,0x51,0xec,0xe6,0x53,0x81,
              0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff
          };"""

          if old_define in content:
              content = content.replace(old_define, new_define, 1)

          content = content.replace("rfc3526_modp2048_p", "rfc2409_modp1024_p")
          content = content.replace("0x80, 0x04, 0x00, 0x0e", "0x80, 0x04, 0x00, 0x02")

          with open(file_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("ikev1.c successfully modified via Python.")
          '

          git add .
          git commit -m "Applied BGE DH2 modifications"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
