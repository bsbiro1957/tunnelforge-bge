name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Initialize and apply smart patch fix via Python
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          import os

          patch_path = "../bge_dh2.patch"
          file_path = "android/app/src/main/cpp/ikev1.c"

          old_target = "0x00, 0x00, 0x00, 0x00,"
          new_target = "0x4f,0xe1,0x35,0x6d,0x6d,0x51,0xc2,0x45,"

          # Megpróbáljuk kiolvasni a patch fájlból a mintát, ha létezik
          if os.path.exists(patch_path):
              with open(patch_path, "r", encoding="utf-8", errors="ignore") as f:
                  patch_content = f.read()
              lines = patch_content.splitlines()
              for i, line in enumerate(lines):
                  if "ikev1.c" in line:
                      for j in range(i+1, min(i+15, len(lines))):
                          if lines[j].startswith("-    0x") or lines[j].startswith("-0x"):
                              old_target = lines[j][1:].strip()
                          elif lines[j].startswith("+    0x") or lines[j].startswith("+0x"):
                              new_target = lines[j][1:].strip()

          print(f"Keresett minta: {old_target}")
          print(f"Cserélve erre: {new_target}")

          with open(file_path, "r", encoding="utf-8") as f:
              file_lines = f.readlines()

          new_file_lines = []
          replaced = False
          
          # Elsődleges próbálkozás: rugalmas szóköz-független egyezés
          for line in file_lines:
              if old_target.replace(" ", "") in line.replace(" ", ""):
                  indent = line[:line.index("0x")] if "0x" in line else "    "
                  new_file_lines.append(indent + new_target + "\n")
                  replaced = True
              else:
                  new_file_lines.append(line)

          # Ha elsőre nem ment, univerzális keresés a nullás tömbre
          if not replaced:
              print("Figyelem: Másodlagos univerzális keresés indítása...")
              new_file_lines = []
              for line in file_lines:
                  if "0x00,0x00,0x00,0x00" in line.replace(" ", ""):
                      indent = line[:line.index("0x")] if "0x" in line else "    "
                      new_file_lines.append(indent + new_target + "\n")
                      replaced = True
                  else:
                      new_file_lines.append(line)

          if replaced:
              with open(file_path, "w", encoding="utf-8") as f:
                  f.writelines(new_file_lines)
              print("Siker: Az ikev1.c sikeresen frissítve!")
          else:
              print("Hiba: A cél sor teljesen hiányzik az ikev1.c-ből!")
              exit(1)
          '

          git add .
          git commit -m "Applied BGE DH2 fix"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
