name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TunnelForge 0.7.4
        uses: actions/checkout@v4
        with:
          ref: v0.7.4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply BGE DH2 modification
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/cpp/ikev1.c")
          s = p.read_text()

          old = """// IKE DH group 14 (MODP2048): must match Phase 1 proposal and mbedtls_mpi_read_binary below.
          #define IKE_DH_PUBKEY_BYTES 256"""
          new = """/* BGE test build: IKEv1 DH Group 2 (MODP1024). */
          #define IKE_DH_PUBKEY_BYTES 128
          static const uint8_t rfc2409_modp1024_p[128] = {
              0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff,
              0xc9,0x0f,0xda,0xa2,0x21,0x68,0xc2,0x34,
              0xc4,0xc6,0x62,0x8b,0x80,0xdc,0x1c,0xd1,
              0x29,0x02,0x4e,0x08,0x8a,0x67,0xcc,0x74,
              0x02,0x0b,0xbe,0xa6,0x3b,0x13,0x9b,0x22,
              0x51,0x4a,0x08,0x79,0x8e,0x34,0x04,0xdd,
              0xef,0x95,0x19,0xb3,0xcd,0x3a,0x43,0x1b,
              0x30,0x2b,0x0a,0x6d,0xf2,0x5f,0x14,0x37,
              0x4f,0xe1,0x35,0x6d,0x6d,0x51,0xc2,0x45,
              0xe4,0x85,0xb5,0x76,0x62,0x5e,0x7e,0xc6,
              0xf4,0x4c,0x42,0xe9,0xa6,0x37,0xed,0x6b,
              0x0b,0xff,0x5c,0xb6,0xf4,0x06,0xb7,0xed,
              0xee,0x38,0x6b,0xfb,0x5a,0x89,0x9f,0xa5,
              0xae,0x9f,0x24,0x11,0x7c,0x4b,0x1f,0xe6,
              0x49,0x28,0x66,0x51,0xec,0xe6,0x53,0x81,
              0xff,0xff,0xff,0xff,0xff,0xff,0xff,0xff
          };"""
          if old not in s:
              raise SystemExit("DH14 marker not found; source changed")
          s = s.replace(old, new, 1)

          s = s.replace(
              "extern const uint8_t rfc3526_modp2048_p[256];\n",
              "",
              1
          )

          old_a = """static const uint8_t attrs_aes[] = {0x80, 0x01, 0x00, 0x07, 0x80, 0x0e, 0x00, 0x80, 0x80, 0x02,
                                      0x00, 0x02, 0x80, 0x03, 0x00, 0x01, 0x80, 0x04, 0x00, 0x0e};"""
          new_a = """static const uint8_t attrs_aes[] = {0x80, 0x01, 0x00, 0x07, 0x80, 0x0e, 0x00, 0x80, 0x80, 0x02,
                                      0x00, 0x02, 0x80, 0x03, 0x00, 0x01, 0x80, 0x04, 0x00, 0x02};"""
          if old_a not in s:
              raise SystemExit("AES proposal marker not found; source changed")
          s = s.replace(old_a, new_a, 1)

          old_3 = """static const uint8_t attrs_3des[] = {0x80, 0x01, 0x00, 0x05, 0x80, 0x02, 0x00, 0x02,
                                        0x80, 0x03, 0x00, 0x01, 0x80, 0x04, 0x00, 0x0e};"""
          new_3 = """static const uint8_t attrs_3des[] = {0x80, 0x01, 0x00, 0x05, 0x80, 0x02, 0x00, 0x02,
                                        0x80, 0x03, 0x00, 0x01, 0x80, 0x04, 0x00, 0x02};"""
          if old_3 not in s:
              raise SystemExit("3DES proposal marker not found; source changed")
          s = s.replace(old_3, new_3, 1)

          old_p = "mbedtls_mpi_read_binary(&P, rfc3526_modp2048_p, sizeof(rfc3526_modp2048_p))"
          new_p = "mbedtls_mpi_read_binary(&P, rfc2409_modp1024_p, sizeof(rfc2409_modp1024_p))"
          if old_p not in s:
              raise SystemExit("DH prime marker not found; source changed")
          s = s.replace(old_p, new_p, 1)

          p.write_text(s)
          print("BGE DH2 modification applied.")
          PY

      - name: Build debug APK
        run: |
          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TunnelForge-BGE-DH2-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

