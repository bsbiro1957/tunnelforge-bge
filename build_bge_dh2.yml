name: Build TunnelForge BGE DH2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (patch & scripts)
        uses: actions/checkout@v4

      - name: Download TunnelForge v0.7.4 source code
        run: |
          curl -L -o tunnel-forge.zip https://github.com/evokelektrique/tunnel-forge/archive/refs/tags/v0.7.4.zip
          unzip -q tunnel-forge.zip
          mv tunnel-forge-* tunnel-forge-src

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Initialize and auto-locate/fix ikev1.c via Python
        run: |
          cd tunnel-forge-src
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Initial v0.7.4 source"

          python3 -c '
          import os

          # Automatikusan megkeressük az ikev1.c fájlt bárhol a mapparendszerben
          target_file = None
          for root, dirs, files in os.walk("."):
              if "ikev1.c" in files:
                  target_file = os.path.join(root, "ikev1.c")
                  break

          if not target_file:
              print("Hiba: Az ikev1.c fájl nem található a repóban!")
              exit(1)

          print(f"Megtalált fájl pontos helye: {target_file}")

          with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          replaced = False
          patterns_to_replace = [
              "0x00, 0x00, 0x00, 0x00,",
              "0x00,0x00,0x00,0x00,",
              "0x00, 0x00, 0x00, 0x00",
              "0x00,0x00,0x00,0x00"
          ]
          new_code = "0x4f, 0xe1, 0x35, 0x6d, 0x6d, 0x51, 0xc2, 0x45,"

          for p in patterns_to_replace:
              if p in content:
                  content = content.replace(p, new_code)
                  replaced = True
                  print(f"Sikeres csere ezzel a mintával: {p}")
                  break

          # Ha nem talált pontos egyezést, soronként keresünk nullás tömböt
          if not replaced:
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "0x00" in line and not replaced:
                      indent = ""
                      for char in line:
                          if char in " \t":
                              indent += char
                          else:
                              break
                      new_lines.append(indent + new_code + "\n")
                      replaced = True
                      print(f"Sor alapú csere végrehajtva ezen: {line.strip()}")
                  else:
                      new_lines.append(line + "\n")
              content = "".join(new_lines)

          if replaced:
              with open(target_file, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Siker: Az ikev1.c sikeresen frissítve!")
          else:
              print("Hiba: Nem találtam cserélhető tömböt az ikev1.c-ben!")
              exit(1)
          '

          git add .
          git commit -m "Applied BGE DH2 fix"

          flutter pub get
          cd android/gvisor
          go mod download
          cd ../..
          make build-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: tunnel-forge-src/build/app/outputs/flutter-apk/app-debug.apk
